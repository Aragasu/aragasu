<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key-Value Extractor Pro</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --card-bg: #252538;
            --text-color: #cdd6f4;
            --accent-color: #cba6f7;
            --border-color: #414559;
            --success-color: #a6e3a1;
            --button-bg: #313244;
            --button-hover: #45475a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        h1 {
            margin-top: 0;
            color: var(--accent-color);
            font-size: 24px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #a6adc8;
            font-size: 14px;
        }

        textarea, input {
            width: 100%;
            padding: 10px;
            background-color: #181825;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            box-sizing: border-box;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            height: 180px;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        /* Preset Styling */
        .preset-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .preset-btn {
            background-color: var(--button-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .preset-btn:hover {
            background-color: var(--button-hover);
            border-color: var(--accent-color);
        }

        /* Ergebnis Box & Kopieren */
        .result-wrapper {
            margin-top: 20px;
            position: relative;
        }

        .result-box {
            padding: 15px;
            background-color: #11111b;
            border-left: 4px solid var(--accent-color);
            border-radius: 4px;
            min-height: 50px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }

        .result-content {
            flex-grow: 1;
        }

        .result-title {
            font-weight: bold;
            color: #a6adc8;
            margin-bottom: 5px;
            font-size: 13px;
        }

        .result-value {
            font-family: 'Courier New', Courier, monospace;
            white-space: pre-wrap;
            word-break: break-all;
            font-size: 16px;
            color: var(--success-color);
        }

        .no-result {
            color: #f38ba8;
            font-style: italic;
        }

        .copy-btn {
            background-color: var(--button-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background-color: var(--button-hover);
            border-color: var(--success-color);
        }
        
        .copy-btn.copied {
            background-color: var(--success-color);
            color: #11111b;
            border-color: var(--success-color);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Key-Value Finder Pro</h1>
    
    <div class="form-group">
        <label for="rawText">1. Text hier hineinkopieren:</label>
        <textarea id="rawText" placeholder="Füge hier deine Logs oder Env-Variablen ein..."></textarea>
    </div>

    <div class="form-group">
        <label for="presetsConfig">Presets verwalten (mit Komma trennen):</label>
        <input type="text" id="presetsConfig" value="OS, Path, npm_package_name, OneDrive" placeholder="z.B. OS, Path, USERNAME">
        <div class="preset-container" id="presetButtons">
            </div>
    </div>

    <div class="form-group" style="margin-top: 20px;">
        <label for="searchKey">2. Welchen Key suchst du?</label>
        <input type="text" id="searchKey" placeholder="Tippe einen Key oder klicke oben ein Preset..." autocomplete="off">
    </div>

    <div class="result-wrapper">
        <div class="result-box">
            <div class="result-content">
                <div class="result-title">Ergebnis:</div>
                <div id="output" class="no-result">Gib einen Text und einen Suchbegriff ein...</div>
            </div>
            <button class="copy-btn" id="copyBtn" style="display: none;">Kopieren</button>
        </div>
    </div>
</div>

<script>
    const rawTextEl = document.getElementById('rawText');
    const searchKeyEl = document.getElementById('searchKey');
    const outputEl = document.getElementById('output');
    const copyBtn = document.getElementById('copyBtn');
    const presetsConfig = document.getElementById('presetsConfig');
    const presetButtonsContainer = document.getElementById('presetButtons');

    let currentFoundValue = "";

    // --- Suchen & Finden Funktion ---
    function findValue() {
        const text = rawTextEl.value;
        const searchKey = searchKeyEl.value.trim();

        if (!text || !searchKey) {
            outputEl.className = 'no-result';
            outputEl.textContent = 'Gib einen Text und einen Suchbegriff ein...';
            copyBtn.style.display = 'none';
            currentFoundValue = "";
            return;
        }

        const lines = text.split('\n');
        
        for (let line of lines) {
            if (line.includes('=')) {
                const index = line.indexOf('=');
                const key = line.substring(0, index).trim();
                const value = line.substring(index + 1).trim();

                if (key.toLowerCase() === searchKey.toLowerCase()) {
                    outputEl.className = 'result-value';
                    outputEl.textContent = value;
                    currentFoundValue = value;
                    copyBtn.style.display = 'block'; // Zeige Kopieren-Button
                    return;
                }
            }
        }

        outputEl.className = 'no-result';
        outputEl.textContent = `Key "${searchKey}" wurde nicht gefunden.`;
        copyBtn.style.display = 'none';
        currentFoundValue = "";
    }

    // --- Kopierfunktion ---
    copyBtn.addEventListener('click', () => {
        if (!currentFoundValue) return;
        
        navigator.clipboard.writeText(currentFoundValue).then(() => {
            copyBtn.textContent = 'Kopiert! ✓';
            copyBtn.classList.add('copied');
            
            // Nach 1.5 Sekunden den Button zurücksetzen
            setTimeout(() => {
                copyBtn.textContent = 'Kopieren';
                copyBtn.classList.remove('copied');
            }, 1500);
        }).catch(err => {
            console.error('Fehler beim Kopieren: ', err);
        });
    });

    // --- Preset Verwaltung ---
    function renderPresets() {
        const configValue = presetsConfig.value;
        localStorage.setItem('extractor_presets', configValue); // Im Browser speichern
        
        presetButtonsContainer.innerHTML = ''; // Container leeren
        
        // Splitte bei Komma und entferne Leerzeichen
        const tags = configValue.split(',').map(tag => tag.trim()).filter(tag => tag.length > 0);
        
        tags.forEach(tag => {
            const btn = document.createElement('button');
            btn.className = 'preset-btn';
            btn.textContent = tag;
            btn.type = 'button';
            
            // Klick auf Preset befüllt die Suche und triggert den Finder
            btn.addEventListener('click', () => {
                searchKeyEl.value = tag;
                findValue();
            });
            
            presetButtonsContainer.appendChild(btn);
        });
    }

    // Beim Laden: Gespeicherte Presets laden falls vorhanden
    if (localStorage.getItem('extractor_presets')) {
        presetsConfig.value = localStorage.getItem('extractor_presets');
    }

    // Event Listener
    rawTextEl.addEventListener('input', findValue);
    searchKeyEl.addEventListener('input', findValue);
    presetsConfig.addEventListener('input', renderPresets);

    // Initiales Rendern der Presets beim Start
    renderPresets();
</script>

</body>
</html>
