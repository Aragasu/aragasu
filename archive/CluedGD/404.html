<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 – CluedGD</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #080000;
      --accent: #ff2222;
      --accent-deep: #990000;
      --glow: rgba(255, 34, 34, .4);
      --text: #ffece8;
      --muted: rgba(255, 200, 195, .55);
      --panel: rgba(20, 5, 5, .62);
      --border: rgba(255, 255, 255, .08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: 'Outfit', system-ui, sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 45% at 50% 25%, rgba(255, 34, 34, .15), transparent 70%),
        radial-gradient(ellipse 90% 65% at 50% 110%, rgba(153, 0, 0, .15), transparent 70%);
      z-index: -1;
    }

    .panel {
      max-width: 520px;
      width: 100%;
      background: var(--panel);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 24px;
      padding: 44px 32px;
      text-align: center;
      border: 1px solid var(--border);
      box-shadow: 0 30px 80px rgba(0, 0, 0, .5);
      animation: rise .7s cubic-bezier(0.34, 1.3, 0.64, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px) scale(.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 4.6rem;
      font-weight: 700;
      letter-spacing: .04em;
      color: var(--accent);
      filter: drop-shadow(0 0 28px var(--glow));
      line-height: 1.1;
    }
    .code .ghost { color: rgba(255, 100, 100, .3); }

    h1 {
      margin: 10px 0 12px;
      font-size: 1.7rem;
      font-weight: 700;
    }

    p {
      color: var(--muted);
      line-height: 1.65;
      font-size: 1rem;
      margin-bottom: 30px;
    }

    .path {
      font-family: 'JetBrains Mono', monospace;
      font-size: .78rem;
      color: rgba(255, 100, 100, .4);
      display: block;
      margin-top: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .actions { display: flex; flex-direction: column; gap: 12px; }

    .actions a {
      text-decoration: none;
      padding: 14px 18px;
      border-radius: 999px;
      font-weight: 600;
      transition: transform .25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow .25s ease, background .25s ease;
      text-align: center;
    }

    .home {
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      color: white;
      box-shadow: 0 10px 40px var(--glow);
    }
    .home:hover { transform: translateY(-3px); box-shadow: 0 16px 54px var(--glow); }

    .back {
      background: rgba(255, 255, 255, .06);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .back:hover { background: rgba(255, 255, 255, .12); transform: translateY(-2px); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>

<body>
  <div class="panel">
    <div class="code">4<span class="ghost">0</span>4</div>
    <h1>Page not found</h1>
    <p>
      This page doesn’t exist, was moved,
      or you followed a broken link.
      <span class="path" id="broken-path"></span>
    </p>

    <div class="actions">
      <a class="home" href="/CluedGD/">← Go back home</a>
      <a class="back" href="javascript:history.back()">← Previous page</a>
    </div>
  </div>

  <script>
    document.getElementById('broken-path').textContent = location.pathname;
    document.querySelector('.home').href = '/CluedGD/';
  </script>
</body>
</html>
